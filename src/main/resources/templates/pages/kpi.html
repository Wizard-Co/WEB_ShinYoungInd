<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}" lang="ko">

<th:block layout:fragment="script">
    <script th:src="@{/mc/common.js}"></script>
    <script type="module" src="/KPI/kpi.js"></script>
<!--    <script th:src="@{//lotstockQ-result.js}"></script>-->
</th:block>

<!--content-->
<section layout:fragment="content">
    <head>
        <style>
            .panel-body-multi input[type="text"],
            .panel-body-multi select.form-select {
                width: 160px;
            }
            .table-style{
                height: 43%;
                overflow-y: auto;
            }

        </style>
    </head>
    <body>
    <loading-form id="loading" class="display-none"></loading-form>
    <main>
        <div class="menu">
            <div class="page-header">
                ■ KPI 조회
            </div>
            <div class="icon">
                <div class="flx">
                    <button type="button" class="btn btn-info m-r-05" id="btnSearch">조회</button>
                    <button type="button" id="btnExcel" class="btn btn-print m-r-05">엑셀</button>
                </div>
            </div>
        </div>
        <div id="searchConditionWrapper">
            <!--            지시일자-->
            <div class="date">
                <div class="search-condition mx-0">
                    <div>
                        <input class="form-check-input" type="checkbox" value="Y" id="chkDate" checked="true"
                               data-target="sDate, eDate">
                        <label class="me-2" for="chkDate">
                            지시일자
                        </label>
                    </div>
                    <div class="flx gap-1">
                        <input type="date" id="sDate" class="text-center">
                        <input type="date" id="eDate" class="text-center">
                    </div>
                </div>
                <div class="btn-date">
                    <input type="radio" class="btn-check date" id="btnToday" name="category" checked style="display:none;">
                    <label class="btn" for="btnToday" style="display:none;">금일</label>
                    <input type="radio" class="btn-check date" id="btnThisMonth" name="category">
                    <label class="btn" for="btnThisMonth">금월</label>
                    <input type="radio" class="btn-check date" id="btnYesterDay" name="category" style="display:none;">
                    <label class="btn" for="btnYesterDay" style="display:none;">전일</label>
                    <input type="radio" class="btn-check" id="btnLastMonth" name="category">
                    <label class="btn" for="btnLastMonth">전월</label>
                    <label class="btn" for="btnLastMonth">　</label>
                    <label class="btn" for="btnLastMonth">　</label>
                </div>
            </div>
            <!--            검색조건-->
            <div class="flx search-area" style="display:none;">
                <div class="panel-body-multi">
                    <div class="search-condition">
                        <input id="chkBuyerArticleNo" data-target="txtBuyerArticleNo"
                               class="form-check-input" type="checkbox" value="Y">
                        <label class="lbl-srh" for="chkBuyerArticleNo">
                            품번
                        </label>
                        <input id="txtBuyerArticleNo"
                               type="text" class="form-control" placeholder="품번 검색">
                    </div>
                    <div class="search-condition">
                        <input id="chkArticle" data-target="txtArticle"
                               class="form-check-input" type="checkbox" value="Y">
                        <label class="lbl-srh" for="chkArticle">
                            품명
                        </label>
                        <input id="txtArticle"
                               type="text" class="form-control" placeholder="거래처 찾기">
                    </div>
                </div>
            </div>
        </div>
        <!--        메인-->
        <section class="flx gap-3">
        <!--생산-->
            <div class="border" style="width: 50%">
                <div class="table-style">
                    <div id="tableP" class="border" style="width:100%"></div>
                </div>
                <div>
                    <canvas id="graphP"></canvas>
                </div>
            </div>
        <!--불량-->
            <div class="border" style="width: 50%">
                <div class="table-style">
                    <div id="tableD" class="border" style="width:100%"></div>
                </div>
                <div>
                    <canvas id="graphD"></canvas>
                </div>
            </div>
        </section>
        <div class="modal fade" id="excelModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 rounded-4 shadow">
                    <div class="modal-header bg-success text-white">
                        <h5 class="modal-title">테이블 선택</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                    </div>
                    <div class="modal-body">
                        <div class="d-grid gap-2">
                            <button class="btn btn-outline-success" data-table-id="tableP">📊 생산량증가</button>
                            <button class="btn btn-outline-success" data-table-id="tableP">📊 불량량증가</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    </body>
</section>
</html>
