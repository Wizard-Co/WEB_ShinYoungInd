<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}" lang="ko">

<th:block layout:fragment="script">
    <script th:src="@{/mc/common.js}"></script>
    <script th:src="@{/product/overview/drilling-result.js}"></script>
</th:block>

<!--content-->
<section layout:fragment="content">
    <head>
        <style>
            .panel-body-multi input[type="text"],
            .panel-body-multi select.form-select {
                width: 100px;
            }
        </style>
    </head>
    <body>
    <loading-form id="loading" class="display-none"></loading-form>
    <main>
        <div class="menu">
            <div class="page-header">
                ■ 천공작업 일보조회
            </div>
            <div class="icon">
                <div class="flx">
                    <button type="button" class="btn btn-info m-r-05" id="btnSearch">조회</button>
                    <button type="button" id="btnExcel" class="btn btn-print m-r-05">엑셀</button>
                </div>
            </div>
        </div>
        <div id="searchConditionWrapper" style="height:110px;">
            <!--            지시일자-->
            <div class="date">
                <div>
                    <div class="search-condition mx-0">
                        <div>
                            <input class="form-check-input" type="checkbox" value="Y" id="chkDate" checked="true"
                                   data-target="sDate, eDate">
                            <label class="me-2" for="chkDate">
                                일자
                            </label>
                        </div>
                        <div class="flx gap-1">
                            <input type="date" id="sDate" class="text-center">
                            <input type="date" id="eDate" class="text-center">
                        </div>
                    </div>
                    <div class="btn-date">
                        <input type="radio" class="btn-check date" id="btnToday" name="category" checked>
                        <label class="btn" for="btnToday">금일</label>
                        <input type="radio" class="btn-check date" id="btnThisMonth" name="category">
                        <label class="btn" for="btnThisMonth">금월</label>
                        <input type="radio" class="btn-check date" id="btnYesterDay" name="category">
                        <label class="btn" for="btnYesterDay">전일</label>
                        <input type="radio" class="btn-check" id="btnLastMonth" name="category">
                        <label class="btn" for="btnLastMonth">전월</label>
                    </div>
                </div>
            </div>
            <!--            검색조건-->
            <div class="flx search-area" style="align-items: flex-start;">
                <div class="panel-body-multi" style="align-self: flex-start;">
                    <div class="search-condition">
                        <input id="chkArticle" data-target="txtArticle"
                               class="form-check-input" type="checkbox" value="Y">
                        <label class="lbl-srh" for="chkArticle">
                            품명
                        </label>
                        <input id="txtArticle"
                               type="text" class="form-control" placeholder="품명 찾기"
                               ondblclick="openModalFinder('txtArticle','txtArticle',77,this.value)"
                               onkeydown="if(event.key === 'Enter'){openModalFinder('txtArticle','txtArticle',77,this.value)}">
                    </div>
                    <div class="search-condition">
                        <input id="chkBuyerArticleNo" data-target="txtBuyerArticleNo"
                               class="form-check-input" type="checkbox" value="Y">
                        <label class="lbl-srh" for="chkBuyerArticleNo">
                            품번
                        </label>
                        <input id="txtBuyerArticleNo"
                               type="text" class="form-control" placeholder="품번 검색"
                               ondblclick="openModalFinder('txtBuyerArticleNo','txtBuyerArticleNo',76,this.value)"
                               onkeydown="if(event.key === 'Enter'){openModalFinder('txtBuyerArticleNo','txtBuyerArticleNo',76,this.value)}">
                    </div>
                    <div class="search-condition">
                        <input id="chkSpec" data-target="txtSpec" class="form-check-input" type="checkbox" value="Y">
                        <label class="lbl-srh" for="chkSpec">
                            규격
                        </label>
                        <input id="txtSpec" type="text" class="form-control" placeholder="규격">
                    </div>
                </div>
                <div class="panel-body-multi" style="align-self: flex-start;">
                    <div class="search-condition">
                        <input id="chkProcess" data-target="cboProcess"
                               class="form-check-input" type="checkbox" value="Y">
                        <label class="lbl-srh" for="chkProcess">
                            공정
                        </label>
                        <select id="cboProcess" class="form-control w150px">
                            <option value="">전체</option>
                            <option th:each="option : ${cboProcess}"
                                    th:value="${option.processID}" th:text="${option.process}">
                        </select>
                    </div>
                    <div class="search-condition">
                        <input id="chkMachine" data-target="cboMachine"
                               class="form-check-input" type="checkbox" value="Y">
                        <label class="lbl-srh" for="chkMachine">
                            호기
                        </label>
                        <select id="cboMachine" class="form-control w150px">
                            <option value="">전체</option>
                            <option th:each="option : ${cboMachine}"
                                    th:value="${option.machineID}" th:text="${option.machine}"
                                    th:attr="data-mapped-process-id=${option.mappedProcessId}">
                        </select>
                    </div>
                </div>
                <div class="panel-body-multi">
                    <div class="search-condition">
                        <input id="chkWorker" data-target="txtWorker"
                               class="form-check-input" type="checkbox" value="Y">
                        <label class="lbl-srh" for="chkWorker">
                            작업자
                        </label>
                        <input id="txtWorker"
                               type="text" class="form-control" placeholder="작업자 찾기"
                               ondblclick="openModalFinder('txtWorker','txtWorker',92,this.value)"
                               onkeydown="if(event.key === 'Enter'){openModalFinder('txtWorker','txtWorker',92,this.value)}">
                    </div>
                    <div class="search-condition">
                        <input id="chkJobType" data-target="cboJobType"
                               class="form-check-input" type="checkbox" value="Y">
                        <label class="lbl-srh" for="chkJobType">
                            작업구분
                        </label>
                        <select id="cboJobType" class="form-select w150px">
                            <option value="">전체</option>
                        </select>
                    </div>
                </div>
                <div class="panel-body-multi">
                    <div class="search-condition">
                        <input id="chkCustom" data-target="txtCustom"
                               class="form-check-input" type="checkbox" value="Y">
                        <label class="lbl-srh" for="chkCustom">
                            거래처
                        </label>
                        <input id="txtCustom"
                               type="text" class="form-control" placeholder="거래처 찾기"
                               ondblclick="openModalFinder('txtCustom','txtCustom',0,this.value)"
                               onkeydown="if(event.key === 'Enter'){openModalFinder('txtCustom','txtCustom',0,this.value)}">
                    </div>
                    <div class="search-condition">
                        <input id="chkDefect"
                               class="form-check-input" type="checkbox" value="Y">
                        <label class="lbl-srh" for="chkDefect">
                            생산불량 발생건만 조회
                        </label>
                    </div>
                </div>
            </div>
        </div>
        <!--        메인-->
        <section class="flx gap-3">
            <div style="width: 80%" class="border">
                <div class="border">
                    <div id="tbMain" class="border" style="width:100%"></div>
                </div>
            </div>
            <div style="width: 20%" class="border">
                <table id="tbSub" class="striped cell-border table-light-info" style="width:100%"></table>
            </div>
        </section>

        <section class="border" style="width:30%">
            <!-- 총계 테이블 -->
            <table id="tbSum" class="striped cell-border table-light-info" style="width:100%"></table>
        </section>
    </main>
    </body>
</section>
</html>
